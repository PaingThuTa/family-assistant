<!doctype html>
<html lang="my">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>အစီအစဉ်</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- defer: the page shows while this loads; app.js (a module) still runs after it. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <p id="message" role="alert" hidden></p>

    <div id="planner">
    <header>
      <div id="people" class="people" hidden></div>
      <div id="tabs" class="segmented">
        <button type="button" data-range="today" class="active">ဒီနေ့</button>
        <button type="button" data-range="tomorrow">မနက်ဖြန်</button>
        <button type="button" data-range="week">၇ ရက်</button>
        <button type="button" data-range="calendar">ပြက္ခဒိန်</button>
      </div>
    </header>

    <section id="calendar" hidden></section>
    <!-- Skeleton cards show instantly, before any script or data arrives. -->
    <main id="list" aria-busy="true">
      <div class="card skeleton"><div class="text"><div class="bar short"></div><div class="bar"></div></div></div>
      <div class="card skeleton"><div class="text"><div class="bar short"></div><div class="bar"></div></div></div>
      <div class="card skeleton"><div class="text"><div class="bar short"></div><div class="bar"></div></div></div>
    </main>

    <button type="button" id="add" class="fab" aria-label="အသစ်ထည့်မယ်" hidden>+</button>
    </div>

    <section id="notes" hidden></section>

    <nav id="nav">
      <button type="button" data-view="planner" class="active">အစီအစဉ်</button>
      <button type="button" data-view="notes">မှတ်စု</button>
    </nav>

    <dialog id="form-dialog">
      <form id="form" novalidate>
        <h2 id="form-title">အသစ်ထည့်မယ်</h2>
        <label>ဘာလုပ်ရမလဲ <input name="title" maxlength="200" required autocomplete="off" /></label>
        <div id="day-chips" class="segmented">
          <button type="button" data-day="today">ဒီနေ့</button>
          <button type="button" data-day="tomorrow">မနက်ဖြန်</button>
          <button type="button" data-day="pick">ရက်ရွေး</button>
        </div>
        <label id="date-field" hidden>ရက်စွဲ <input name="date" type="date" required /></label>
        <label>အချိန် <input name="time" type="time" required /></label>
        <label class="check"><input name="important" type="checkbox" /> ပြီးတဲ့အထိ သတိပေး</label>
        <p id="form-error" class="error" hidden></p>
        <div class="actions">
          <button type="button" id="cancel" class="secondary">မလုပ်တော့ဘူး</button>
          <button type="submit" id="save" class="primary">သိမ်းမယ်</button>
        </div>
        <button type="button" id="delete" class="danger" hidden>ဖျက်မယ်</button>
      </form>
    </dialog>

    <dialog id="note-dialog">
      <form id="note-form" novalidate>
        <h2>မှတ်စုအသစ်</h2>
        <label>ခေါင်းစဉ် <input name="title" maxlength="100" required autocomplete="off" /></label>
        <div id="share-chips" class="segmented">
          <button type="button" data-shared="true" class="active">မိသားစု</button>
          <button type="button" data-shared="false">ကိုယ်ပိုင်</button>
        </div>
        <p id="note-error" class="error" hidden></p>
        <div class="actions">
          <button type="button" id="note-cancel" class="secondary">မလုပ်တော့ဘူး</button>
          <button type="submit" id="note-save" class="primary">သိမ်းမယ်</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
